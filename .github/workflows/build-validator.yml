name: Build validator image

on:
  push:
    branches:
      - 'deploy-build-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/backend-developers-ltd/refinery-validator
    steps:
      - name: Upgrade runner CA certificates
        run: sudo apt-get update && sudo apt-get install -y --only-upgrade ca-certificates

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Determine environment from branch
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" != deploy-build-* ]]; then
            echo "Unsupported branch: $BRANCH" >&2
            exit 1
          fi
          echo "ENVIRONMENT=${BRANCH#deploy-build-}" >> "$GITHUB_ENV"

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./validator
          file: ./validator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}-${{ env.ENVIRONMENT }}:v0-latest
            ${{ env.IMAGE }}-${{ env.ENVIRONMENT }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
