services:
  subtensor:
    # ghcr.io/opentensor/subtensor-localnet - bump by re-resolving the tag's digest
    # (docker buildx imagetools inspect ... --format '{{json .Manifest.Digest}}').
    image: ghcr.io/opentensor/subtensor-localnet@sha256:3c2122aa1fe77b8a771dee921dd44b0102584daf77bb00cfdb8c4ca301b74bd2
    # The image's /scripts/localnet.sh hardcodes each authority's argv and accepts no extra node flags,
    # so this wrapper patches the caches in before handing over to it.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail

        # Cap the per-node caches. Substrate defaults to a 1 GiB trie cache (--trie-cache-size) and a
        # ~339 MB RocksDB block cache PER NODE; three colocated authorities therefore grow towards ~4 GB
        # of caches alone - more RAM than this machine has - and the host OOMs every few hours. 64 MiB of
        # each is ample for a localnet. The patch must be idempotent: a container restart reuses the same
        # writable layer, so an unconditional sed would append a second set of flags and trip the check
        # below on every restart. Bail out loudly if the upstream script stops matching, so a bad image
        # bump fails visibly instead of silently reverting to the 1 GiB default.
        if ! grep -q -- '--trie-cache-size' /scripts/localnet.sh; then
          sed -i 's/^\( *\)--unsafe-force-node-key-generation$$/\1--unsafe-force-node-key-generation\n\1--trie-cache-size 67108864\n\1--db-cache 64/' /scripts/localnet.sh
        fi
        capped=$$(grep -c -- '--trie-cache-size' /scripts/localnet.sh || true)
        if [ "$$capped" != "3" ]; then
          echo "FATAL: expected to cap 3 authorities' caches, patched $$capped - localnet.sh changed upstream" >&2
          exit 1
        fi

        exec /scripts/localnet.sh "$$@"
      - refinery-localchain
    # "False" selects the non-fast-runtime binary baked into the image -> standard 12s blocks (like
    # finney), not the 250ms fast-blocks default. "--no-purge" keeps the chain DB across restarts
    # instead of wiping it to a fresh genesis. Both binaries are prebuilt in the image (BUILD_BINARY=0),
    # so no toolchain is needed. These reach localnet.sh through the wrapper's "$@".
    command: ["False", "--no-purge"]
    restart: unless-stopped
    # Hard ceiling so a runaway node hits the cgroup limit instead of the host's OOM killer picking a
    # victim of its own choosing (last time it left the box thrashing at load 98 with sshd barely
    # answering). memswap_limit equal to mem_limit disables swap for the container: thrashing the host's
    # small swap only dragged block production down before the kill came anyway.
    mem_limit: 3g
    memswap_limit: 3g
    # Bind the RPC/WS ports to the private VLAN IP only - never the public interface.
    ports:
      - "${CHAIN_BIND_IP:?}:9944:9944"
      - "${CHAIN_BIND_IP:?}:9933:9933"
    # Persist all three authorities' base-paths. The chain runs 3 colocated Aura/Grandpa validators
    # (//One //Two //Three) and finality needs 2/3, so every node's DB must survive a restart -
    # including a `docker compose up -d` that RECREATES the container (image bump), which wipes
    # container-local /tmp. With these volumes + --no-purge the subnet state, registrations and stake
    # all persist across restarts and host reboots.
    volumes:
      - chain_one:/tmp/one
      - chain_two:/tmp/two
      - chain_three:/tmp/three
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9944'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Non-validating archive full node: the authorities run with Substrate's default state pruning (the
  # last ~256 blocks of state only) and the pruning mode of an existing DB cannot be changed, so readers
  # of historical state (the TAO20 attester backfilling its 8-day price windows) get their own node that
  # keeps every block's state. A bounded pruning window (--state-pruning 72000, on RocksDb and on ParityDb
  # alike) is NOT an option on this node: it holds ~65 KB of RAM per block of the window and OOM-killed
  # the node at the 1 GiB cap around block 9_000 of the initial sync, while the archive stays flat at
  # ~530 MiB. The price is disk: state costs ~150 KB/block here (~1.1 GB/day on 12 s blocks), so watch
  # the volume; to shrink it, stop the service, delete the chain_archive volume and let it resync (~2.5
  # blocks/s). Never an authority, so losing it cannot affect block production or finality.
  archive:
    image: ghcr.io/opentensor/subtensor-localnet@sha256:3c2122aa1fe77b8a771dee921dd44b0102584daf77bb00cfdb8c4ca301b74bd2
    depends_on:
      - subtensor
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        BIN=/target/non-fast-runtime/release/node-subtensor

        # Same binary and the same `build-spec --chain local` call as the image's localnet.sh -> a
        # byte-identical spec, i.e. the same genesis as the authorities.
        "$$BIN" build-spec --disable-default-bootnode --raw --chain local > /tmp/local.json

        # The bootnode address embeds authority One's peer id; derive it from One's persisted node key
        # (read-only mount) instead of pinning it here, so a regenerated key never strands this node.
        PEER_ID=$$("$$BIN" key inspect-node-key --file /one/chains/bittensor/network/secret_ed25519)

        exec "$$BIN" \
          --base-path /tmp/archive \
          --chain /tmp/local.json \
          --name refinery-archive \
          --state-pruning archive \
          --bootnodes "/dns/subtensor/tcp/30334/p2p/$$PEER_ID" \
          --port 30337 \
          --rpc-port 9945 \
          --rpc-cors=all \
          --unsafe-rpc-external \
          --allow-private-ipv4 \
          --discover-local \
          --trie-cache-size 67108864 \
          --db-cache 64
    restart: unless-stopped
    # Same cap pattern as the authorities; an OOM kill here only pauses syncing until the restart.
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "${CHAIN_BIND_IP:?}:9945:9945"
    volumes:
      - chain_archive:/tmp/archive
      - chain_one:/one:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9945'"]
      interval: 5s
      timeout: 3s
      retries: 10
# NOTE: chain state is PERSISTENT (volumes below + --no-purge). A restart of this service, an image
# bump, or a host reboot resume the existing chain - they no longer wipe genesis. The bootstrap step
# (deploy/linode/README.md) therefore runs once; the validator + miners stay registered across restarts.
# Timelocked commit-reveal requires this machine to have OUTBOUND internet (the Drand offchain worker
# pulls quicknet pulses from api.drand.sh); without egress, commits never reveal. See the README.
volumes:
  chain_one:
  chain_two:
  chain_three:
  chain_archive:
