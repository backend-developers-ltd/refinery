services:
  miner:
    # Replaced with a real digest on first promotion - see deploy/README.md ("Promote the miner image").
    image: ghcr.io/backend-developers-ltd/refinery-miner-${ENVIRONMENT:?}@sha256:48b7f5326c7df7ae237027dab160de5b76fbbede7b2762d6c68874ff22c7c3b4
    restart: unless-stopped
    env_file: ./.env
    environment:
      MINER_SUBTENSOR_NETWORK: "ws://${CHAIN_VLAN_IP:?}:9944"
      MINER_NETUID: "${NETUID:?}"
      MINER_NAME: "${MINER_NAME:-honest}"
      MINER_RESPONSE_DELAY_S: "${MINER_RESPONSE_DELAY_S:-0}"
      # Advertised on-chain so the validator can reach this miner's axon over the VLAN.
      MINER_AXON_EXTERNAL_IP: "${MINER_VLAN_IP:?}"
      MINER_AXON_PORT: "${MINER_AXON_PORT:?}"
      MINER_WALLET_DIR: "/wallets"
    # Publish the axon port on the VLAN IP only; open it to the validator in the firewall.
    ports:
      - "${MINER_VLAN_IP:?}:${MINER_AXON_PORT:?}:${MINER_AXON_PORT:?}"
    volumes:
      - miner-wallets:/wallets

  # Per-container metrics for this machine, published on all interfaces so an EXTERNAL Prometheus
  # (separate from the validator's own) can scrape it over the public interface. cAdvisor is
  # unauthenticated - restrict :8080 to the external Prometheus's IP in the Cloud Firewall (§8).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.40.0
    restart: unless-stopped
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    ports:
      - "8080:8080"

  # Host-level metrics for this machine, exposed on all interfaces (:9100) for the external Prometheus.
  # Host networking is needed for accurate host/network stats. node-exporter is unauthenticated -
  # restrict :9100 to the external Prometheus's IP in the Cloud Firewall (§8).
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|boot|var/.+)($$|/)'
      - '--collector.tcpstat'

volumes:
  miner-wallets:
