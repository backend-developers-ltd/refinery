services:
  pylon:
    # backenddevelopersltd/bittensor-pylon:2.3.4 - bump via knowledge/validator.deploy.md (Procedure 3).
    image: backenddevelopersltd/bittensor-pylon@sha256:2e7a3470b1ff6f4a72f53a075c1f215cd352a0d289387bad10f328825f396dbb
    restart: unless-stopped
    env_file: ./.env
    environment:
      PYLON_BITTENSOR_NETWORK: "${BITTENSOR_NETWORK:?}"
      PYLON_BITTENSOR_ARCHIVE_NETWORK: "${BITTENSOR_ARCHIVE_NETWORK:-${BITTENSOR_NETWORK:?}}"
      PYLON_OPEN_ACCESS_TOKEN: "${VALIDATOR_PYLON_OPEN_ACCESS_TOKEN:?}"
      PYLON_IDENTITIES: '["validator"]'
      PYLON_BITTENSOR_WALLET_PATH: "/wallets"
      PYLON_TEMPO: "360"
      PYLON_ID_VALIDATOR_WALLET_NAME: "${BITTENSOR_WALLET_NAME:?}"
      PYLON_ID_VALIDATOR_HOTKEY_NAME: "${BITTENSOR_WALLET_HOTKEY_NAME:?}"
      PYLON_ID_VALIDATOR_NETUID: "${NETUID:?}"
      PYLON_ID_VALIDATOR_TOKEN: "${VALIDATOR_PYLON_OPEN_ACCESS_TOKEN:?}"
      PYLON_METRICS_TOKEN: "${PYLON_METRICS_TOKEN:?}"
    volumes:
      - "${HOST_WALLET_DIR:?}:/wallets:ro"

  validator:
    # Replaced with a real digest on first promotion - see knowledge/validator.deploy.md (Procedure 2).
    image: ghcr.io/backend-developers-ltd/refinery-validator-${ENVIRONMENT:?}@sha256:06d0ffd1ff0751cd79b0ee819bbeba182e7d3544cdcbf71df01372df50c0604b
    restart: unless-stopped
    env_file: ./.env
    environment:
      VALIDATOR_PYLON_SERVICE_ADDRESS: "http://pylon:8000"
      VALIDATOR_PYLON_IDENTITY_NAME: "validator"
      VALIDATOR_PYLON_IDENTITY_TOKEN: "${VALIDATOR_PYLON_OPEN_ACCESS_TOKEN:?}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    # Miners POST their solutions back to the validator's callback endpoint. Publish it so
    # remote miners can reach it; bound to VALIDATOR_CALLBACK_HOST (the IP the validator
    # advertises) when set, else all interfaces. Restrict exposure with a host firewall.
    ports:
      - "${VALIDATOR_CALLBACK_HOST:-0.0.0.0}:${VALIDATOR_CALLBACK_PORT:-8001}:${VALIDATOR_CALLBACK_PORT:-8001}"
    depends_on:
      - pylon
      - alloy

  alloy:
    # grafana/alloy:v1.21.2
    image: grafana/alloy@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    restart: unless-stopped
    environment:
      # Alloy talks only to the local proxy. The proxy adds the wallet identity,
      # netuid, and Bittensor signature before forwarding to central.
      TRACES_UPSTREAM_URL: "http://prometheus-proxy:8000"
    volumes:
      - ./alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - prometheus-proxy

  cadvisor:
    # ghcr.io/google/cadvisor:v0.60.6
    image: ghcr.io/google/cadvisor@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: unless-stopped
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro

  node-exporter:
    image: prom/node-exporter:latest
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|boot|var/.+)($$|/)'
      - '--collector.tcpstat'

  prometheus:
    # backenddevelopersltd/bittensor_prometheus:1.0.3
    image: backenddevelopersltd/bittensor_prometheus@sha256:35112f61ffdeb2627f6626ad5ce6cabf0d1598e63f6758cd0b81cd28b494767a
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      - cadvisor
      - pylon
      - prometheus-proxy
    volumes:
      - "${HOST_WALLET_DIR:?}:/wallets:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: |
      /bin/sh -c 'cat <<EOF > /etc/prometheus/prometheus.yml.template
      global:
        scrape_interval: 30s
      scrape_configs:
        - job_name: 'validator'
          static_configs:
            - targets: ['cadvisor:8080', 'host.docker.internal:9100']
              labels:
                hotkey: '{hotkey}'
                bittensor_network: $${BITTENSOR_NETWORK:-finney}
        - job_name: 'pylon'
          static_configs:
            - targets: ['pylon:8000']
              labels:
                hotkey: '{hotkey}'
                bittensor_network: $${BITTENSOR_NETWORK:-finney}
          authorization:
            type: Bearer
            credentials: $${PYLON_METRICS_TOKEN}
      remote_write:
        - url: "http://prometheus-proxy:8000/prometheus/outbound"
      EOF
      exec /entrypoint.sh --log.level=debug --storage.tsdb.retention.size=1GB'


  prometheus-proxy:
    # ghcr.io/bittensor-church/bittensor-prometheus-proxy:1.0.3
    image: ghcr.io/bittensor-church/bittensor-prometheus-proxy@sha256:39caeb310b1b29baef8e7794157fa66953e0e610e9bd712589bb84bf7cff2286
    restart: unless-stopped
    environment:
      CENTRAL_PROMETHEUS_PROXY_URL: "https://prometheus.bactensor.io"
      CENTRAL_TEMPO_PROXY_URL: "https://prometheus.bactensor.io"
      ENV: "prometheus-proxy-prod"
      SECRET_KEY: "${PROMETHEUS_PROXY_SECRET_KEY:?}"
      BITTENSOR_NETUID: "${NETUID:?}"
      BITTENSOR_WALLET_NAME: "${BITTENSOR_WALLET_NAME:?}"
      BITTENSOR_WALLET_HOTKEY_NAME: "${BITTENSOR_WALLET_HOTKEY_NAME:?}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
    volumes:
      - "${HOST_WALLET_DIR:?}:/root/.bittensor/wallets"

volumes:
  alloy-data: {}
